# Loki single-binary, filesystem storage, 2-year retention. Runs on the Mac (0003)
# and on the telemetry VM (0006).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true      # required for OTLP ingest
  retention_period: 17520h             # 730 days
  # Accept lines as old as the retention period, so a fresh VM's first ship
  # cycle backfills every ledger line instead of only the last week (spec 0006).
  # The default is one week; older lines are refused as `greater_than_max_sample_age`.
  # Loki 3.7.x docs (AGPL-3.0, cited, not copied), retrieved 2026-10-22:
  # https://grafana.com/docs/loki/v3.7.x/operations/request-validation-rate-limits/
  reject_old_samples_max_age: 17520h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment, landing_host, landing_project]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

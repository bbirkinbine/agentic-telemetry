# Loki single-binary, filesystem storage, 2-year retention. Assembled from docs; not yet run.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true      # required for OTLP ingest
  retention_period: 17520h             # 730 days
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment, landing_host, landing_project]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Tempo single-binary, local storage, 90-day retention. Optional.
# Data lives under /var/tempo: in the image, /tempo is the tempo binary itself.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 2160h   # 90 days

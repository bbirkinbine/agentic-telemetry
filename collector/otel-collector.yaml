# OTel Collector for the telemetry stack: the same file runs on the Mac (spec 0003)
# and on the telemetry VM (spec 0006).
# Validate before first start, by digest and with the archive feature gate that
# compose.yaml passes (LLAMA_SWAP_TARGET must be set; any placeholder works):
#   docker run --rm -e LLAMA_SWAP_TARGET=gpu.example:9292 -v "$PWD/otel-collector.yaml:/c.yaml:ro" \
#     otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806 \
#     validate --config=/c.yaml --feature-gates=exporter.file.nativeCompression
# Assembled from the Collector component READMEs and vendor OTLP docs.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:            # checkpoints for filelog so landing files are never re-ingested
    directory: /state
    create_directory: true
  # Optional: require a bearer token from clients (Claude Code sends
  # OTEL_EXPORTER_OTLP_HEADERS). Verify server-side use of this extension
  # against the installed Collector version before enabling.
  # bearertokenauth:
  #   token: ${env:TELEMETRY_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Ledgers shipped by mac-agent/ship-ledgers.sh (spec 0004); one JSON object per
  # line. Only ledgers are tailed: transcripts (landing/<host>/_sessions/ and each
  # delegate run's results/<run>/session/) carry captured tool content, so they
  # stay files that run-table and session-table read in batch.
  # `include` globs: filelog receiver README (Apache-2.0), retrieved 2026-10-22,
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.163.0/receiver/filelogreceiver/README.md
  # (v0.163.0 is the newest tag at or below the 0.163.1 image).
  # Timestamp: `gotime` uses Go's own parser (stanza timestamp docs, Apache-2.0,
  # retrieved 2026-10-22,
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.163.0/pkg/stanza/docs/types/timestamp.md).
  # Go's time.Parse accepts a fractional second after the seconds "even if the
  # layout does not signify its presence" (BSD-3-Clause, retrieved 2026-10-22,
  # https://pkg.go.dev/time#Parse), so one layout reads both the ledger's
  # `...:56Z` and `...:56.123Z`; its zone field also takes a `+00:00` offset.
  filelog/landing:
    include:
      - /landing/*/*/.agentic/delegate/ledger.jsonl
      - /landing/*/*/.agentic/telemetry/*.jsonl
    start_at: beginning
    storage: file_storage
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.ts
          layout: '2006-01-02T15:04:05Z07:00'
          layout_type: gotime
        on_error: send_quiet        # a malformed line is kept as raw text, not dropped
      # /landing/<host>/<project>/.agentic/... -> resource attributes, which
      # loki-config.yaml makes index labels: one Loki stream per project. As log
      # attributes they were only structured metadata, every ledger shared one
      # stream, and Loki refused a line "too far behind" another project's newer
      # one (spec 0004, D4). `parse_to` (default `attributes`) takes a field, and
      # `resource` is a field prefix: stanza regex_parser and field docs, v0.163.0,
      # Apache-2.0, retrieved 2026-10-22,
      # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.163.0/pkg/stanza/docs/operators/regex_parser.md
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        parse_to: resource
        regex: '^/landing/(?P<landing_host>[^/]+)/(?P<landing_project>[^/]+)/'
        on_error: send_quiet

  # Scrape the llama-swap gateway's own system and GPU metrics (needs
  # `performance.disabled: false` on the inference host). The target is the
  # gateway's host:port from collector/.env, passed in by compose; the real value
  # lives in the vault's ENDPOINTS.md, never in this file.
  # Never scrape /upstream/<model-id>/... through llama-swap: in v264 every request
  # to a loaded model resets its idle TTL, so a 30 s scrape would keep the model
  # loaded and hide the swap waits this stack exists to observe (spec 0003, D6).
  # Per-model llamacpp:* metrics come from a scraper on the inference host (spec 0007).
  prometheus/servers:
    config:
      scrape_configs:
        - job_name: llama-swap
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:LLAMA_SWAP_TARGET}"]

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 1500
    spike_limit_mib: 300

  resource:
    attributes:
      - { key: deployment.environment, value: homelab, action: upsert }

  # Second redaction layer. The first is at the source (hook or SDK).
  redaction:
    allow_all_keys: true
    blocked_values:
      - 'sk-[A-Za-z0-9_-]{20,}'                   # OpenAI/Anthropic-style keys
      - 'AKIA[0-9A-Z]{16}'                        # AWS access key id
      - '-----BEGIN [A-Z ]*PRIVATE KEY-----'      # PEM
      - 'gh[pousr]_[A-Za-z0-9]{36,}'              # GitHub tokens
      - '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'            # emails
    summary: debug

  transform/size:
    log_statements:
      - context: log
        statements:
          - truncate_all(attributes, 16384)
    trace_statements:
      - context: span
        statements:
          - truncate_all(attributes, 16384)

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Long-term stores. Each accepts OTLP/HTTP natively; otlphttp appends /v1/<signal>.
  otlphttp/victoriametrics:
    endpoint: http://victoriametrics:8428/opentelemetry
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls: { insecure: true }
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls: { insecure: true }

  # The source-agnostic raw record. One rotating file per signal: OTLP JSON lines in a
  # standard zstd stream (feature gate exporter.file.nativeCompression, set in
  # compose.yaml), readable with `zstd -dc`.
  file/metrics:
    path: /archive/metrics.jsonl.zst
    format: json
    compression: zstd
    rotation: { max_megabytes: 256, max_days: 3650, max_backups: 100000, localtime: false }
  file/logs:
    path: /archive/logs.jsonl.zst
    format: json
    compression: zstd
    rotation: { max_megabytes: 256, max_days: 3650, max_backups: 100000, localtime: false }
  file/traces:
    path: /archive/traces.jsonl.zst
    format: json
    compression: zstd
    rotation: { max_megabytes: 256, max_days: 3650, max_backups: 100000, localtime: false }

  debug:
    verbosity: basic

service:
  extensions: [health_check, file_storage]
  pipelines:
    metrics:
      receivers: [otlp, prometheus/servers]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/victoriametrics, file/metrics]
    logs:
      receivers: [otlp, filelog/landing]
      processors: [memory_limiter, resource, redaction, transform/size, batch]
      exporters: [otlphttp/loki, file/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, redaction, transform/size, batch]
      exporters: [otlphttp/tempo, file/traces]
